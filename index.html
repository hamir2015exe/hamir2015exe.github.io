<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamit & Power Şevko Müzik Platformu</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <div class="header">
        <h1>🎵 Hamit & Power Şevko Müzik</h1>
        <div class="nav-bar">
            <input type="text" id="urlInput" placeholder="Adres yazın (örn: /admin)..." onkeydown="if(event.key==='Enter') checkRoute()">
            <button onclick="checkRoute()">Git</button>
        </div>
    </div>
    <h2>🔥 Yayınlanan Müzikler ve Videolar</h2>
    <br>
    <div class="music-grid" id="musicContainer"></div>
    <script src="uygulama.js"></script>
    <script>
        window.onload = function() {
            // Eğer URL'de /admin varsa direkt admin sayfasına yönlendir
            if (window.location.pathname.endsWith('admin') || window.location.search.includes('admin')) {
                window.location.href = 'admin.html';
            }
            renderPublicSongs();
        }

        function checkRoute() {
            const input = document.getElementById('urlInput').value.trim().toLowerCase();
            if (input === '/admin' || input === 'admin') {
                window.location.href = 'admin.html';
            } else {
                alert("Geçersiz adres! Admin için '/admin' yazmalısınız.");
            }
        }
    </script>
</body>
</html>
