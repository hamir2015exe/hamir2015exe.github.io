<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Hamit & Power Şevko</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <div class="header">
        <h1>🛠️ Admin & Power Şevko Paneli</h1>
        <div class="nav-bar">
            <button onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>
        </div>
    </div>

    <!-- Şifre Ekranı -->
    <div id="loginScreen" class="admin-panel" style="max-width: 400px; margin: 50px auto;">
        <h2>🔐 Yönetici Girişi</h2>
        <br>
        <div class="form-group">
            <label>Şifre (2015):</label>
            <input type="password" id="adminPassword" placeholder="Şifreyi girin..." onkeydown="if(event.key==='Enter') loginAdmin()">
        </div>
        <button onclick="loginAdmin()">Giriş Yap</button>
    </div>

    <!-- Admin Kontrol Paneli -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <h2>📥 YouTube Video / Şarkı Yükleme ve İndirme</h2>
        <p style="color:#aaa; font-size:13px; margin-bottom:15px;">YouTube linkini gir, görselini kapak yap ve akışta paylaş!</p>
        
        <div class="form-group">
            <label>Şarkı / Video Adı:</label>
            <input type="text" id="songTitle" placeholder="Örn: Efsane Parça">
        </div>
        <div class="form-group">
            <label>Sanatçı:</label>
            <input type="text" id="songArtist" placeholder="Örn: Power Şevko">
        </div>
        <div class="form-group">
            <label>YouTube Video Linki:</label>
            <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
        </div>

        <!-- İndirme ve Kalite Seçenekleri -->
        <div class="form-group" style="flex-direction: row; gap: 10px; align-items: center;">
            <button onclick="simulateDownload('standard')" style="background-color: #333;">Videoyu İndir</button>
            <button onclick="simulateDownload('4k')" style="background-color: #555;">Görseliyle 4K İndir</button>
        </div>

        <hr style="border-color: #333; margin: 15px 0;">

        <!-- Yayınlama Anahtarı (Aç/Kapat Tuşu) -->
        <div class="form-group" style="flex-direction: row; align-items: center; justify-content: space-between; background: #121212; padding: 10px; border-radius: 5px;">
            <label style="cursor: pointer;">🔄 İndirilenleri Otomatik Yayınla (Aç/Kapat):</label>
            <input type="checkbox" id="publishToggle" style="width: 20px; height: 20px; cursor: pointer;" checked>
        </div>

        <button onclick="publishSong()" style="width: 100%; margin-top: 10px; background-color: #8b0000;">Yayınla ve Paylaş</button>
    </div>

    <script src="uygulama.js"></script>
    <script>
        function loginAdmin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "2015") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                alert("Giriş başarılı!");
            } else {
                alert("Hatalı Şifre! Sadece 2015 girilmelidir.");
            }
        }
    </script>
</body>
</html>
