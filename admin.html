<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Hamit & Power Şevko</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <div class="header">
        <h1>🛠️ Admin & Power Şevko Paneli</h1>
        <div class="nav-bar">
            <button onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>
        </div>
    </div>

    <!-- Şifre Ekranı -->
    <div id="loginScreen" class="admin-panel" style="max-width: 400px; margin: 50px auto;">
        <h2>🔐 Yönetici Girişi</h2>
        <br>
        <div class="form-group">
            <label>Şifre (2015):</label>
            <input type="password" id="adminPassword" placeholder="Şifreyi girin..." onkeydown="if(event.key==='Enter') loginAdmin()">
        </div>
        <button onclick="loginAdmin()">Giriş Yap</button>
    </div>

    <!-- Admin Kontrol Paneli -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <h2>📥 Doğrudan Medya Dosyası Ekle</h2>
        <p style="color:#aaa; font-size:13px; margin-bottom:15px;">İndirdiğin dosya linkini (.mp3/.mp4) buraya yapıştır, YouTube'a hiç gitmeden sitede çalınsın!</p>
        
        <div class="form-group">
            <label>Medya Başlığı:</label>
            <input type="text" id="songTitle" placeholder="Örn: Kayıp Kalp">
        </div>
        <div class="form-group">
            <label>Sanatçı:</label>
            <input type="text" id="songArtist" placeholder="Örn: BLOK3">
        </div>
        <div class="form-group">
            <label>Medya Dosya Linki (.mp3 veya .mp4):</label>
            <input type="text" id="mediaUrl" placeholder="Doğrudan dosya adresi...">
        </div>
        <div class="form-group">
            <label>Kapak Resmi Linki:</label>
            <input type="text" id="coverUrl" placeholder="Görsel linki...">
        </div>

        <button onclick="publishLocalFile()" style="width: 100%; margin-top: 10px; background-color: #8b0000;">Sitede Reklamsız Yayınla</button>
    </div>

    <script src="uygulama.js"></script>
    <script>
        function loginAdmin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "2015") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                alert("Giriş başarılı!");
            } else {
                alert("Hatalı Şifre!");
            }
        }
    </script>
</body>
</html>
